<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>玻璃图标生成器</title>
<style>
  :root{color-scheme:light}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{background:#EEF7FE;color:#17202a;font:14px/1.45 -apple-system,system-ui,"PingFang SC",sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  /* 顶部标题 */
  .top{flex:0 0 auto;padding:calc(4px + env(safe-area-inset-top)) 14px 0;display:flex;align-items:center;gap:10px}
  .title{font-size:15px;font-weight:600;flex:1;color:#17202a}
  .tag{font-size:11px;color:#0a6fd0;background:#ffffffaa;border:1px solid #bcd9f0;border-radius:999px;padding:2px 8px}
  /* 吸顶预览 */
  .stage{flex:0 0 auto;padding:0 14px 6px;box-shadow:0 8px 16px rgba(70,110,150,.10);position:relative;z-index:5;background:#EEF7FE}
  .card{background:#dfe8f1;border-radius:12px;padding:6px;display:flex;justify-content:center;width:fit-content;margin:0 auto}
  #cv{width:min(38vw,142px);height:min(38vw,142px);border-radius:11px;display:block;background:#c9d4e0}
  /* 参数区 */
  .sheet{flex:0 0 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 14px 4px}
  h2{font-size:11px;letter-spacing:.6px;color:#7b8b9a;margin:9px 0 3px;font-weight:600}
  .row{display:flex;align-items:center;gap:9px;margin:5px 0}
  .row label{flex:0 0 76px;color:#46566a;font-size:12.5px}
  .row input[type=range]{flex:1;height:22px;background:transparent;-webkit-appearance:none;appearance:none}
  .row input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#d3e2ef}
  .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
      background:#fff;border:1px solid #cddcea;margin-top:-7px;box-shadow:0 1px 4px rgba(70,110,150,.28)}
  .v{flex:0 0 40px;text-align:right;color:#0a7bd0;font-size:11.5px;font-variant-numeric:tabular-nums}
  select{background:#ffffff;color:#17202a;border:1px solid #d3e2ef;border-radius:8px;padding:7px 10px;font-size:13.5px;flex:1}
  /* 导入区（放在参数下方） */
  .drop{margin:10px 0 2px;border:1.5px dashed #b7cfe2;border-radius:12px;padding:14px 12px;text-align:center;
        color:#54677a;background:#ffffffcc;font-size:13.5px}
  .drop.hot{border-color:#0a84ff;color:#0a6fd0;background:#ffffff}
  .drop b{color:#0a84ff;font-weight:600}
  .hint{color:#8296a8;font-size:11px;text-align:center;margin-top:4px}
  /* 底部按钮 */
  .bar{flex:0 0 auto;display:flex;gap:10px;
       padding:8px 14px calc(10px + env(safe-area-inset-bottom));
       background:#EEF7FE}
  .btn{flex:1;text-align:center;border-radius:12px;padding:12px;font-size:14.5px;font-weight:600;background:#ffffff;color:#17202a;border:1px solid #d3e2ef}
  .btn.pri{background:#0a84ff;color:#fff}
</style>
</head>
<body>
  <div class="top">
    <div class="title">玻璃图标生成器 <span style="font-size:10px;color:#8aa0b4;font-weight:400">v2.5</span></div>
    <div class="tag" id="tag">实时预览</div>
  </div>

  <div class="stage">
    <div class="card"><canvas id="cv" width="512" height="512"></canvas></div>
  </div>

  <div class="sheet" id="sheet">
    <h2>外框</h2>
    <div class="row"><label>圆角</label><input id="radius" type="range" min="8" max="34" step="0.5" value="21.9"><span class="v" id="radiusV"></span></div>
    <div class="row"><label>外圈亮边</label><input id="rim" type="range" min="0" max="1.2" step="0.02" value="0.80"><span class="v" id="rimV"></span></div>
    <div class="row"><label>亮边宽度</label><input id="rimW" type="range" min="1" max="8" step="0.2" value="3"><span class="v" id="rimWV"></span></div>

    <h2>背景玻璃</h2>
    <div class="row"><label>磨砂</label><input id="frost" type="range" min="0" max="1" step="0.02" value="0.85"><span class="v" id="frostV"></span></div>
    <div class="row"><label>压暗</label><input id="dim" type="range" min="0.80" max="1.0" step="0.005" value="0.92"><span class="v" id="dimV"></span></div>

    <h2>主体玻璃</h2>
    <div class="row"><label>主体亮边</label><input id="sRim" type="range" min="0" max="1.2" step="0.02" value="0.75"><span class="v" id="sRimV"></span></div>
    <div class="row"><label>主体投影</label><input id="sShadow" type="range" min="0" max="0.8" step="0.02" value="0.35"><span class="v" id="sShadowV"></span></div>
    <div class="row"><label>主体体积</label><input id="sVol" type="range" min="0" max="0.6" step="0.02" value="0.25"><span class="v" id="sVolV"></span></div>

    <h2>输出</h2>
    <div class="row"><label>尺寸</label><select id="size"><option>1024</option><option>2048</option><option>512</option></select><span class="v"></span></div>
    <div class="row"><label>自动裁边</label><select id="autocrop"><option value="1">纯色底（黑/白）</option><option value="2">任意背景（照片/渐变）</option><option value="0">关</option></select><span class="v"></span></div>

    <div class="drop" id="drop">点这里选照片（可多选），或拖入图片 / ZIP<br><span style="font-size:12px;color:#6d6d79">（在本机处理，不上传）</span></div>
    <div class="hint" id="hint">选好照片后可回到上面调参数，预览始终可见</div>

    <div id="batch" hidden>
      <h2>批量结果 <span id="count" style="color:#7fd0ff"></span></h2>
      <div id="grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn pri" id="zipAll" style="flex:1">下载全部 ZIP</button>
        <button class="btn" id="clearAll" style="flex:0 0 90px">清空</button>
      </div>
    </div>
  </div>

  <div class="bar">
    <button class="btn pri" id="save">下载 PNG</button>
    <button class="btn" id="reset">恢复默认</button>
  </div>

  <input id="file" type="file" accept="image/*,.zip,application/zip" multiple hidden>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d',{willReadFrequently:true});
let img=null, imgName='icon';
const PREVIEW_MAX=512;

/* ---------- 模糊 ---------- */
function boxBlur(src,w,h,r){
  const tmp=new Float32Array(w*h), out=new Float32Array(w*h), win=2*r+1;
  for(let y=0;y<h;y++){
    let acc=0,row=y*w;
    for(let i=-r;i<=r;i++) acc+=src[row+Math.min(w-1,Math.max(0,i))];
    for(let x=0;x<w;x++){
      tmp[row+x]=acc/win;
      acc+=src[row+Math.min(w-1,x+r+1)]-src[row+Math.max(0,x-r)];
    }
  }
  for(let x=0;x<w;x++){
    let acc=0;
    for(let i=-r;i<=r;i++) acc+=tmp[Math.min(h-1,Math.max(0,i))*w+x];
    for(let y=0;y<h;y++){
      out[y*w+x]=acc/win;
      acc+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x];
    }
  }
  return out;
}
function gauss(src,w,h,sigma){
  const r=Math.max(1,Math.round(sigma*0.85));
  return boxBlur(boxBlur(boxBlur(src,w,h,r),w,h,r),w,h,r);
}
function pct(arr,p){
  const step=Math.max(1,Math.floor(arr.length/40000)), s=[];
  for(let i=0;i<arr.length;i+=step) s.push(arr[i]);
  s.sort((a,b)=>a-b);
  return s[Math.min(s.length-1,Math.floor(s.length*p))]||1;
}

/* ---------- 参数 ---------- */
function labels(){
  $('radiusV').textContent=(+$('radius').value).toFixed(1)+'%';
  $('rimV').textContent=(+$('rim').value).toFixed(2);
  $('rimWV').textContent=(+$('rimW').value).toFixed(1);
  $('frostV').textContent=(+$('frost').value).toFixed(2);
  $('dimV').textContent=(+$('dim').value).toFixed(2);
  $('sRimV').textContent=(+$('sRim').value).toFixed(2);
  $('sShadowV').textContent=(+$('sShadow').value).toFixed(2);
  $('sVolV').textContent=(+$('sVol').value).toFixed(2);
}


/* ---------- 自动裁掉外围纯色边框 ---------- */
function autoCropBox(im){
  const T=160;
  const c=document.createElement('canvas'); c.width=c.height=T;
  const x=c.getContext('2d',{willReadFrequently:true});
  const k=Math.max(T/im.width,T/im.height);
  const dw=im.width*k, dh=im.height*k;
  x.drawImage(im,(T-dw)/2,(T-dh)/2,dw,dh);
  const d=x.getImageData(0,0,T,T).data;
  const px=(a,b)=>{const i=(b*T+a)*4;return [d[i],d[i+1],d[i+2]];};
  const cs=[px(2,2),px(T-3,2),px(2,T-3),px(T-3,T-3)];
  const bg=[0,1,2].map(i=>(cs[0][i]+cs[1][i]+cs[2][i]+cs[3][i])/4);
  // 仅当外围是近黑/近白时才裁，避免把满版彩色背景裁掉
  const isBlack=Math.max(bg[0],bg[1],bg[2])<45;
  const isWhite=Math.min(bg[0],bg[1],bg[2])>225;
  if(!isBlack&&!isWhite) return null;
  let x0=T,y0=T,x1=0,y1=0,found=false;
  for(let y=0;y<T;y++)for(let a=0;a<T;a++){
    const i=(y*T+a)*4;
    const dd=Math.hypot(d[i]-bg[0],d[i+1]-bg[1],d[i+2]-bg[2]);
    if(dd>26){ found=true; if(a<x0)x0=a; if(a>x1)x1=a; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  if(!found) return null;
  // 映射回原图坐标（画布是 cover 放置的）
  const sx=(im.width*dw/T), sy=(im.height*dh/T);
  const ox=(dw-T)/2, oy=(dh-T)/2;
  const bx0=Math.max(0,(x0+ox)*sx/dw*k*0+ (x0-Math.max(0,ox))* (im.width/T) );
  // 简化：直接用比例换算
  const fx=(v)=>{ const t=(v/T)*dw - dw/2 ; return (im.width/2 + t*(im.width/dw)); };
  const fy=(v)=>{ const t=(v/T)*dh - dh/2 ; return (im.height/2 + t*(im.height/dh)); };
  const X0=Math.max(0,Math.min(im.width-1,fx(x0-1)));
  const X1=Math.min(im.width,Math.max(X0+2,fx(x1+2)));
  const Y0=Math.max(0,Math.min(im.height-1,fy(y0-1)));
  const Y1=Math.min(im.height,Math.max(Y0+2,fy(y1+2)));
  return {x:X0,y:Y0,w:X1-X0,h:Y1-Y0};
}

/* ---------- 按主色区域自动裁切（去掉底部横幅等） ---------- */
function dominantBox(im){
  const T=200;
  const c=document.createElement('canvas'); c.width=c.height=T;
  const x=c.getContext('2d',{willReadFrequently:true});
  const k=Math.max(T/im.width,T/im.height);
  const dw=im.width*k, dh=im.height*k;
  x.drawImage(im,(T-dw)/2,(T-dh)/2,dw,dh);
  const d=x.getImageData(0,0,T,T).data;

  // 颜色直方图（量化到 16 级）
  const hist=new Map();
  for(let i=0;i<T*T;i++){
    const p=i*4;
    const key=((d[p]>>4)<<8)|((d[p+1]>>4)<<4)|(d[p+2]>>4);
    hist.set(key,(hist.get(key)||0)+1);
  }
  let bestKey=0,bestN=0;
  for(const [k2,v] of hist) if(v>bestN){bestN=v;bestKey=k2;}
  if(bestN < T*T*0.25) return null;   // 没有明显主色

  const qr=(bestKey>>8)&15, qg=(bestKey>>4)&15, qb=bestKey&15;
  const target=[qr*16+8,qg*16+8,qb*16+8];

  const mask=new Uint8Array(T*T);
  for(let i=0;i<T*T;i++){
    const p=i*4;
    const dd=Math.hypot(d[p]-target[0],d[p+1]-target[1],d[p+2]-target[2]);
    mask[i]=dd<34?1:0;
  }
  // 取最大连通域
  const seen=new Uint8Array(T*T); let best=null;
  const stack=new Int32Array(T*T);
  for(let s=0;s<T*T;s++){
    if(!mask[s]||seen[s]) continue;
    let sp=0; stack[sp++]=s; seen[s]=1;
    let minX=T,minY=T,maxX=0,maxY=0,cnt=0;
    while(sp){
      const idx=stack[--sp]; cnt++;
      const y=(idx/T)|0, xx=idx-y*T;
      if(xx<minX)minX=xx; if(xx>maxX)maxX=xx;
      if(y<minY)minY=y; if(y>maxY)maxY=y;
      if(xx>0){const n=idx-1; if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n;}}
      if(xx<T-1){const n=idx+1; if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n;}}
      if(y>0){const n=idx-T; if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n;}}
      if(y<T-1){const n=idx+T; if(mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n;}}
    }
    if(!best||cnt>best.cnt) best={cnt,minX,minY,maxX,maxY};
  }
  if(!best) return null;
  // 收紧边界：把不符合主色的行/列剔除
  const rowOk=(y)=>{ let n=0,ok=0;
    for(let xx=best.minX;xx<=best.maxX;xx+=2){ const p=(y*T+xx)*4; n++;
      const dd=Math.hypot(d[p]-target[0],d[p+1]-target[1],d[p+2]-target[2]); if(dd<30) ok++; }
    return n? ok/n>0.35 : false; };
  const colOk=(xx)=>{ let n=0,ok=0;
    for(let y=best.minY;y<=best.maxY;y+=2){ const p=(y*T+xx)*4; n++;
      const dd=Math.hypot(d[p]-target[0],d[p+1]-target[1],d[p+2]-target[2]); if(dd<30) ok++; }
    return n? ok/n>0.35 : false; };
  while(best.maxY>best.minY+8 && !rowOk(best.maxY)) best.maxY--;
  while(best.minY<best.maxY-8 && !rowOk(best.minY)) best.minY++;
  while(best.maxX>best.minX+8 && !colOk(best.maxX)) best.maxX--;
  while(best.minX<best.maxX-8 && !colOk(best.minX)) best.minX++;

  const bw=best.maxX-best.minX+1, bh=best.maxY-best.minY+1;
  const ratio=(bw*bh)/(T*T);
  const square=bw/bh;
  if(ratio<0.35||ratio>0.96) return null;      // 太大或太小都不裁
  if(square<0.7||square>1.45) return null;      // 太不方正也不裁

  const fx=v=>Math.min(im.width, Math.max(0, im.width/2 + (v/T*dw - dw/2)*(im.width/dw)));
  const fy=v=>Math.min(im.height,Math.max(0, im.height/2+ (v/T*dh - dh/2)*(im.height/dh)));
  const X0=fx(best.minX), X1=fx(best.maxX+1), Y0=fy(best.minY), Y1=fy(best.maxY+1);
  if(X1-X0<10||Y1-Y0<10) return null;
  return {x:X0,y:Y0,w:X1-X0,h:Y1-Y0};
}

/* ---------- 任意背景裁切：四角同色，找差值区域的外接框 ---------- */
function anyBgBox(im){
  const T=200;
  const c=document.createElement('canvas'); c.width=c.height=T;
  const x=c.getContext('2d',{willReadFrequently:true});
  const k=Math.max(T/im.width,T/im.height);
  const dw=im.width*k, dh=im.height*k;
  x.drawImage(im,(T-dw)/2,(T-dh)/2,dw,dh);
  const d=x.getImageData(0,0,T,T).data;

  // 图标通常比背景更鲜艳：用饱和度挑出主体
  const mask=new Uint8Array(T*T);
  for(let i=0;i<T*T;i++){
    const p=i*4, r=d[p],g=d[p+1],b=d[p+2];
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    const sat=mx?(mx-mn)/mx:0;
    mask[i]=(sat>0.32 && mx>55)?1:0;
  }
  const seen=new Uint8Array(T*T), stack=new Int32Array(T*T);
  let best=null;
  for(let s0=0;s0<T*T;s0++){
    if(!mask[s0]||seen[s0]) continue;
    let sp=0; stack[sp++]=s0; seen[s0]=1;
    let minX=T,minY=T,maxX=0,maxY=0,cnt=0;
    while(sp){
      const idx=stack[--sp]; cnt++;
      const yy=(idx/T)|0, xx=idx-yy*T;
      if(xx<minX)minX=xx; if(xx>maxX)maxX=xx;
      if(yy<minY)minY=yy; if(yy>maxY)maxY=yy;
      const nb=[xx>0?idx-1:-1, xx<T-1?idx+1:-1, yy>0?idx-T:-1, yy<T-1?idx+T:-1];
      for(const n of nb){ if(n>=0&&mask[n]&&!seen[n]){seen[n]=1;stack[sp++]=n;} }
    }
    if(cnt<120) continue;                     // 忽略小色块
    if(!best||cnt>best.cnt) best={cnt,minX,minY,maxX,maxY};
  }
  if(!best) return null;
  const bw=best.maxX-best.minX+1, bh=best.maxY-best.minY+1;
  const ratio=(bw*bh)/(T*T), sq=bw/bh;
  if(ratio<0.10||ratio>0.95) return null;
  if(sq<0.5||sq>2.0) return null;
  const fx=v=>Math.min(im.width, Math.max(0, im.width/2 + (v/T*dw - dw/2)*(im.width/dw)));
  const fy=v=>Math.min(im.height,Math.max(0, im.height/2+ (v/T*dh - dh/2)*(im.height/dh)));
  return {x:fx(best.minX-1), y:fy(best.minY-1), w:fx(best.maxX+2)-fx(best.minX-1), h:fy(best.maxY+2)-fy(best.minY-1)};
}

/* ---------- 主处理 ---------- */
function process(S){
  if(!img) return null;
  const sc=document.createElement('canvas'); sc.width=sc.height=S;
  const sx=sc.getContext('2d'); sx.imageSmoothingQuality='high';
  // 可选：先自动裁掉外围纯色
  let src=img, box=null;
  const ac=$('autocrop').value;
  if(ac==='1'){ try{ box=autoCropBox(img)||dominantBox(img); }catch(e){ box=null; } }
  else if(ac==='2'){ try{ box=anyBgBox(img); }catch(e){ box=null; } }
  const sw=box?box.w:img.width, sh=box?box.h:img.height;
  const k=Math.max(S/sw,S/sh);
  const dw=sw*k, dh=sh*k;
  if(box) sx.drawImage(img,box.x,box.y,box.w,box.h,(S-dw)/2,(S-dh)/2,dw,dh);
  else sx.drawImage(img,(S-dw)/2,(S-dh)/2,dw,dh);
  const id=sx.getImageData(0,0,S,S), d=id.data, n=S*S;

  const R=new Float32Array(n), G=new Float32Array(n), B=new Float32Array(n), L=new Float32Array(n);
  for(let i=0,p=0;i<n;i++,p+=4){
    R[i]=d[p]; G[i]=d[p+1]; B[i]=d[p+2];
    L[i]=0.299*d[p]+0.587*d[p+1]+0.114*d[p+2];
  }

  const Lb=gauss(L,S,S,2.0);
  const Gm=new Float32Array(n);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const i=y*S+x;
    const x0=x>0?x-1:x, x1=x<S-1?x+1:x, y0=y>0?y-1:y, y1=y<S-1?y+1:y;
    const gx=(Lb[y*S+x1]-Lb[y*S+x0])*0.5, gy=(Lb[y1*S+x]-Lb[y0*S+x])*0.5;
    Gm[i]=Math.hypot(gx,gy);
  }
  const gm=pct(Gm,0.99);

  const band=new Float32Array(n);
  for(let i=0;i<n;i++){ let v=(Gm[i]/gm-0.08)/0.30; band[i]=v<0?0:(v>1?1:v); }
  const bandS=gauss(band,S,S,1.4);
  const protect=gauss(bandS,S,S,10.0);

  const sRim=+$('sRim').value, sSh=+$('sShadow').value, sVol=+$('sVol').value;
  const frost=+$('frost').value, dim=+$('dim').value;

  const frR=gauss(R,S,S,4.0), frG=gauss(G,S,S,4.0), frB=gauss(B,S,S,4.0);
  const low=gauss(L,S,S,18.0);
  const dv=new Float32Array(n);
  for(let i=0;i<n;i++) dv[i]=Math.abs(L[i]-low[i]);
  const vmax=pct(dv,0.99);

  const oR=new Float32Array(n), oG=new Float32Array(n), oB=new Float32Array(n);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const i=y*S+x;
    const fw=(1-Math.min(1,protect[i]*1.4))*frost;
    let r=R[i]*(1-fw)+frR[i]*fw, g=G[i]*(1-fw)+frG[i]*fw, b=B[i]*(1-fw)+frB[i]*fw;
    r*=dim; g*=dim; b*=dim;

    const dir=0.75+0.30*(1-(x+y)/(2*S));
    const br=Math.min(0.95, bandS[i]*sRim*dir);
    const si=(y-6>=0&&x-4>=0)?(y-6)*S+(x-4):-1;
    let sh=si>=0?Math.max(0,bandS[si]-bandS[i]*0.9):0;
    sh=Math.min(1,sh)*sSh;
    let v=(L[i]-low[i])/vmax; v=v<-1?-1:(v>1?1:v); v*=bandS[i];
    const vb=Math.max(0,v)*sVol, vd=Math.max(0,-v)*sVol*1.1;

    r*= (1-sh)*(1-vd); g*=(1-sh)*(1-vd); b*=(1-sh)*(1-vd);
    r=r*(1-br)+255*br; g=g*(1-br)+255*br; b=b*(1-br)+255*br;
    r=r*(1-vb)+255*vb; g=g*(1-vb)+255*vb; b=b*(1-vb)+255*vb;

    oR[i]=r; oG[i]=g; oB[i]=b;
  }

  /* 外框圆角 + 明亮玻璃边 */
  const Rad=S*(+$('radius').value)/100, half=S/2, edge=half-Rad;
  const rimAmp=+$('rim').value, rimW=+$('rimW').value;
  const P1=Math.max(1.2,rimW*0.9), P2=Math.max(P1+2,rimW*3.3), PS=P1+rimW*5.3;
  for(let y=0;y<S;y++){
    const ay=Math.abs(y+0.5-half), dy=ay-edge;
    for(let x=0;x<S;x++){
      const i=y*S+x, p=i*4;
      const ax=Math.abs(x+0.5-half), dx=ax-edge;
      const pdx=dx>0?dx:0, pdy=dy>0?dy:0;
      const dist=Math.hypot(pdx,pdy)+Math.min(Math.max(dx,dy),0)-Rad;
      const depth=-dist;
      let a=depth+0.5; a=a<0?0:(a>1?1:a);
      if(a===0){ d[p+3]=0; continue; }
      const dir=0.80+0.20*(1-(x+y)/(2*S));
      let b2=dir*(rimAmp*Math.exp(-Math.pow((depth-P1)/rimW,2))+0.23*Math.exp(-Math.pow((depth-P2)/(rimW*2.4),2)));
      if(b2>0.92) b2=0.92;
      const sh2=0.065*Math.exp(-Math.pow((depth-PS)/(rimW*2.1),2));
      const k=(1-sh2)*(1-b2), add=255*b2;
      d[p]  =oR[i]*k+add;
      d[p+1]=oG[i]*k+add;
      d[p+2]=oB[i]*k+add;
      d[p+3]=a*255;
    }
  }

  const oc=document.createElement('canvas'); oc.width=oc.height=S;
  oc.getContext('2d').putImageData(id,0,0);
  return oc;
}

/* ---------- 渲染调度（节流） ---------- */
let pending=false, lastOut=null;
const ICON_CSS=124;   // 图标显示尺寸；灰框留一圈边距，方便看清图标四边
function draw(canvas){
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const cw=cv.clientWidth||176, ch=cv.clientHeight||176;
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.imageSmoothingQuality='high';
  const side=Math.min(Math.round(ICON_CSS*dpr), cv.width-2);
  const ox=Math.round((cv.width-side)/2), oy=Math.round((cv.height-side)/2);
  ctx.drawImage(canvas,ox,oy,side,side);
}
function schedule(){
  labels();
  if(pending||!img) return;
  pending=true;
  requestAnimationFrame(()=>{
    pending=false;
    const oc=process(PREVIEW_MAX);
    if(oc){ lastOut=oc; draw(oc); }
  });
}
function renderNow(){ labels(); if(!img) return; const oc=process(PREVIEW_MAX); if(oc){lastOut=oc; draw(oc);} }

/* ---------- ZIP 读取 ---------- */
async function readZip(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  const dv=new DataView(buf.buffer);
  let eocd=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--){
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  }
  if(eocd<0) throw new Error('not zip');
  const count=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true);
  const out=[];
  for(let i=0;i<count;i++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true);
    const csize=dv.getUint32(off+20,true);
    const nlen=dv.getUint16(off+28,true);
    const elen=dv.getUint16(off+30,true);
    const clen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(buf.subarray(off+46,off+46+nlen));
    off+=46+nlen+elen+clen;
    if(name.endsWith('/')||name.startsWith('__MACOSX')) continue;
    if(!/\.(png|jpe?g|webp|gif|bmp)$/i.test(name)) continue;
    const lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
    const dstart=lho+30+lnlen+lelen;
    const raw=buf.subarray(dstart,dstart+csize);
    let data;
    if(method===0) data=raw;
    else if(method===8){
      try{
        const ds=new DecompressionStream('deflate-raw');
        const st=new Blob([raw]).stream().pipeThrough(ds);
        data=new Uint8Array(await new Response(st).arrayBuffer());
      }catch(e){ continue; }
    } else continue;
    const base=name.split('/').pop();
    const ext=base.split('.').pop().toLowerCase();
    out.push(new File([data],base,{type:'image/'+(ext==='jpg'?'jpeg':ext)}));
  }
  return out;
}

/* ---------- ZIP 打包（store，无压缩） ---------- */
const CRC_T=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(items){ // [{name, data:Uint8Array}]
  const enc=new TextEncoder(); const parts=[]; const central=[]; let offset=0;
  for(const it of items){
    const nb=enc.encode(it.name), crc=crc32(it.data), size=it.data.length;
    const lh=new Uint8Array(30+nb.length), dv=new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,size,true); dv.setUint32(22,size,true);
    dv.setUint16(26,nb.length,true); dv.setUint16(28,0,true);
    lh.set(nb,30);
    parts.push(lh, it.data);
    const ch=new Uint8Array(46+nb.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0,true);
    cv.setUint32(16,crc,true); cv.setUint32(20,size,true); cv.setUint32(24,size,true);
    cv.setUint16(28,nb.length,true); cv.setUint16(30,0,true); cv.setUint16(32,0,true);
    cv.setUint16(34,0,true); cv.setUint16(36,0,true); cv.setUint32(38,0,true);
    cv.setUint32(42,offset,true); ch.set(nb,46);
    central.push(ch);
    offset+=lh.length+size;
  }
  let csize=0; central.forEach(c=>csize+=c.length);
  const eocd=new Uint8Array(22), dv=new DataView(eocd.buffer);
  dv.setUint32(0,0x06054b50,true); dv.setUint16(8,items.length,true); dv.setUint16(10,items.length,true);
  dv.setUint32(12,csize,true); dv.setUint32(16,offset,true); dv.setUint16(20,0,true);
  return new Blob([...parts,...central,eocd],{type:'application/zip'});
}

let results=[], busy=false;

function fileToImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=e.target.result; };
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
const stripExt=n=>n.replace(/\.[^.]+$/,'');

function addTile(url,name){
  const d=document.createElement('div');
  d.style.cssText='position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#f2f2f2;border:1px solid #e0e0e0';
  const im=document.createElement('img');
  im.src=url; im.style.cssText='width:100%;height:100%;object-fit:cover;display:block';
  im.onclick=()=>openOverlay(url,name,'image/png');
  d.appendChild(im);
  $('grid').appendChild(d);
}

async function addFiles(list){
  if(busy) return;
  const files=[...list];
  let imgs=[];
  busy=true; $('tag').textContent='读取中…';
  for(const f of files){
    if(/\.zip$/i.test(f.name)||f.type==='application/zip'){
      try{ imgs.push(...await readZip(f)); }catch(e){ console.warn('zip fail',e); }
    } else if(f.type.startsWith('image/')) imgs.push(f);
  }
  if(!imgs.length){ $('hint').textContent='没有找到可用图片'; busy=false; $('tag').textContent='实时预览'; return; }

  // 第一张进主预览
  const first=await fileToImage(imgs[0]);
  img=first; imgName=stripExt(imgs[0].name||'icon');
  renderNow();

  if(imgs.length>1){
    $('batch').hidden=false; $('grid').innerHTML=''; results=[];
    const size=parseInt($('size').value,10)||1024;
    for(let i=0;i<imgs.length;i++){
      $('tag').textContent=`批量处理 ${i+1}/${imgs.length}`;
      await new Promise(r=>setTimeout(r,0));
      const im=await fileToImage(imgs[i]);
      img=im;
      const oc=process(size);
      const blob=await new Promise(r=>oc.toBlob(r,'image/png'));
      const name=stripExt(imgs[i].name||('icon'+i))+'_玻璃.png';
      results.push({name,blob});
      addTile(URL.createObjectURL(blob),name);
    }
    img=first;
    $('count').textContent=`（${results.length} 张）`;
    $('tag').textContent=`完成 ${results.length} 张`;
  } else {
    $('batch').hidden=true;
    $('tag').textContent='实时预览';
  }
  busy=false;
}

$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>{ if(e.target.files.length) addFiles(e.target.files); $('file').value=''; };
['dragenter','dragover'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.add('hot');}));
['dragleave','drop'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.remove('hot');}));
$('drop').addEventListener('drop',e=>{ const f=e.dataTransfer.files; if(f && f.length) addFiles(f); });
window.addEventListener('paste',e=>{ for(const it of (e.clipboardData||{}).items||[]) if(it.type.startsWith('image/')) addFiles([it.getAsFile()]); });

$('clearAll').onclick=()=>{ results=[]; $('grid').innerHTML=''; $('batch').hidden=true; $('count').textContent=''; };
$('zipAll').onclick=async()=>{
  if(!results.length) return;
  $('tag').textContent='打包中…';
  const items=[];
  for(const r of results){
    const buf=new Uint8Array(await r.blob.arrayBuffer());
    items.push({name:r.name, data:buf});
  }
  const blob=makeZip(items);
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`图标批量_${results.length}张.zip`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  $('tag').textContent='已打包';
};

/* ---------- 载入 ---------- */
function loadFile(f){
  if(!f||!f.type.startsWith('image/')) return;
  imgName=(f.name||'icon').replace(/\.(png|jpe?g|webp|gif|bmp|heic)$/i,'');
  const r=new FileReader();
  r.onload=e=>{
    const im=new Image();
    im.onload=()=>{ img=im; $('tag').textContent='已载入'; renderNow(); $('sheet').scrollTop=0; };
    im.onerror=()=>{ $('tag').textContent='读取失败'; };
    im.src=e.target.result;
  };
  r.readAsDataURL(f);
}
$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); };
['dragenter','dragover'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.add('hot');}));
['dragleave','drop'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.remove('hot');}));
$('drop').addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) loadFile(f); });
window.addEventListener('paste',e=>{ for(const it of (e.clipboardData||{}).items||[]) if(it.type.startsWith('image/')) loadFile(it.getAsFile()); });

['radius','rim','rimW','frost','dim','sRim','sShadow','sVol','size'].forEach(id=>{
  $(id).addEventListener('input',schedule);
  $(id).addEventListener('change',schedule);
});


/* 点预览图：删除当前图 */
cv.style.cursor='pointer';
cv.addEventListener('click',()=>{
  if(!img) return;
  img=null;
  ctx.clearRect(0,0,cv.width,cv.height);
  $('tag').textContent='实时预览';
  $('hint').textContent='已移除当前图片，可重新选择';
});

/* ---------- 保存 ---------- */
$('save').onclick=()=>{
  if(!img){ $('tag').textContent='先选照片'; return; }
  $('tag').textContent='生成中…';
  setTimeout(()=>{
    const oc=process(parseInt($('size').value,10));
    oc.toBlob(b=>{
      const url=URL.createObjectURL(b);
      let ov=document.getElementById('ov');
      if(!ov){
        ov=document.createElement('div'); ov.id='ov';
        ov.style.cssText='position:fixed;inset:0;background:#000000ee;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px';
        const t=document.createElement('div'); t.textContent='长按图片 → 存储到照片';
        t.style.cssText='color:#cfcfd8;font-size:14px';
        const im=document.createElement('img'); im.id='ovimg';
        im.style.cssText='max-width:88vw;max-height:66vh;border-radius:16px;background:#c9d4e0;box-shadow:0 10px 40px rgba(40,70,100,.35)';
        const col=document.createElement('div'); col.style.cssText='display:flex;gap:10px';
        const a=document.createElement('a'); a.id='ovdl'; a.textContent='下载'; a.style.cssText='background:#0a84ff;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;text-decoration:none';
        const c=document.createElement('button'); c.textContent='关闭'; c.style.cssText='border:0;border-radius:12px;padding:11px 18px;background:#2c2c34;color:#eaeaf0;font-weight:600'; c.onclick=()=>ov.remove();
        col.append(a,c); ov.append(t,im,col); document.body.append(ov);
      }
      document.getElementById('ovimg').src=url;
      const a=document.getElementById('ovdl'); a.href=url; a.download=imgName+'_玻璃图标.png';
      $('tag').textContent='实时预览';
      setTimeout(()=>URL.revokeObjectURL(url),120000);
    },'image/png');
  },30);
};
$('reset').onclick=()=>{
  $('radius').value=21.9; $('rim').value=0.80; $('rimW').value=3;
  $('frost').value=0.85; $('dim').value=0.92;
  $('sRim').value=0.75; $('sShadow').value=0.35; $('sVol').value=0.25; $('size').value='1024';
  schedule();
};
labels();
</script>
